name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code assets/app.css

  smoke:
    runs-on: ubuntu-latest
    needs: build-css
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
